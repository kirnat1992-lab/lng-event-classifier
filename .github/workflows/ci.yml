name: Python test and reproducibility check
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and end-to-end tests
        run: python -m pytest -q
      - name: Rebuild synthetic demo evaluation
        run: python -m lng_event_classifier.train --model-dir artifacts --report-dir reports
